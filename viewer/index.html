<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mobile-first character sheet viewer for Foundry VTT shares.">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5' fill='%23050505' stroke='%23c7a46c' stroke-width='2'/%3E%3Ctext x='16' y='21' font-size='13' text-anchor='middle' fill='%23c7a46c' font-family='serif' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
  <title>SheetShare Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Caudex:wght@400;700&family=Noto+Serif+SC:wght@700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/app.css?v=0.2.20-ui">
  <script defer src="assets/path-utils.js?v=0.1.2-world-media"></script>
  <script defer src="assets/app.js?v=0.2.20-ui"></script>
  <script defer src="assets/alpine.min.js"></script>
</head>
<body>
  <main class="app" x-data="characterSheetViewer()" x-init="init()" x-on:keydown.escape.window="closeReference()" x-cloak>
    <header class="topbar">
      <div class="brand">
        <h1 x-text="selected?.summary.name || t('brand')">SheetShare Mobile</h1>
        <p x-text="selected ? (selected?.summary.classes || worldTitle) : worldTitle"></p>
      </div>
      <button class="ghost-button" type="button" x-show="selected && !externalAuth" x-on:click="showList()" x-text="t('lock')">Lock</button>
    </header>

    <section class="screen" x-show="error">
      <div class="empty-state">
        <strong x-text="t('dataUnavailable')">Data unavailable</strong>
        <p x-text="error"></p>
      </div>
    </section>

    <section class="screen" x-show="loading && !error" aria-busy="true">
      <span class="visually-hidden" x-text="t('loading')">Loading</span>
      <div class="skeleton-shell" aria-hidden="true">
        <div class="skeleton-identity">
          <div class="skeleton skeleton-portrait"></div>
          <div class="skeleton-lines">
            <div class="skeleton skeleton-line" style="width: 68%"></div>
            <div class="skeleton skeleton-line" style="width: 42%"></div>
            <div class="skeleton skeleton-line" style="width: 54%"></div>
          </div>
        </div>
        <div class="skeleton-grid">
          <div class="skeleton skeleton-tile"></div>
          <div class="skeleton skeleton-tile"></div>
          <div class="skeleton skeleton-tile"></div>
          <div class="skeleton skeleton-tile"></div>
        </div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-block" style="height: 90px"></div>
      </div>
    </section>

    <section class="screen" x-show="!loading && needsPassword && !selected && !error">
      <div class="unlock-card">
        <div class="unlock-badge" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round">
            <path d="M24 3 42 10v13c0 11-7.6 18.4-18 22C14.4 41.4 6 34 6 23V10L24 3Z"/>
            <rect x="17" y="21" width="14" height="11" rx="2"/>
            <path d="M20 21v-3a4 4 0 0 1 8 0v3" stroke-linecap="round"/>
          </svg>
        </div>
        <h2 x-text="t('enterPasswordTitle')">Enter Share Password</h2>
        <p x-text="t('passwordHelp')">This mobile sheet is protected.</p>
        <form x-on:submit.prevent="unlock()">
          <div class="password-field">
            <input class="search" id="share-password" name="share-password" :type="showPassword ? 'text' : 'password'" autocomplete="current-password" :placeholder="t('passwordPlaceholder')" x-model="password">
            <button class="password-toggle" type="button" x-on:click="showPassword = !showPassword" :aria-label="showPassword ? t('hidePassword') : t('showPassword')" :aria-pressed="showPassword">
              <svg x-show="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg x-show="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path d="m4 4 16 16"/>
              </svg>
            </button>
          </div>
          <p class="unlock-error" x-show="unlockError" x-text="unlockError"></p>
          <button class="primary-button" type="submit" :disabled="unlocking" x-text="unlocking ? t('unlocking') : t('unlockSheet')"></button>
        </form>
      </div>
    </section>

    <section class="screen" x-show="selected && !error">
      <div class="detail-shell" x-on:click="handleContentClick($event)">
        <aside class="summary-column">
          <section class="identity">
            <div class="portrait" :class="{ inspired: selected?.summary?.inspiration }">
              <img x-show="selected?.summary.portrait" :src="assetUrl(selected?.summary.portrait)" alt="" width="78" height="78" loading="lazy">
              <span x-show="!selected?.summary.portrait" x-text="initials(selected?.summary.name)"></span>
            </div>
            <div>
              <h2 x-text="selected?.summary.name" :class="nameLengthClass(selected?.summary.name)" :title="selected?.summary.name"></h2>
              <p x-text="[selected?.summary.species, selected?.summary.classes].filter(Boolean).join(' / ')"></p>
              <p class="identity-meta" x-show="selected?.summary?.inspiration !== undefined"><span class="inspiration-chip" :class="{ active: selected?.summary?.inspiration }" :title="t('inspiration')">★ <span x-text="t('inspiration')"></span></span></p>
            </div>
          </section>

          <section class="stat-grid">
            <div class="stat-tile"><span>AC</span><strong x-text="selected?.summary.ac || '-'"></strong></div>
            <div class="stat-tile"><span x-text="t('initiative')">Initiative</span><strong x-text="selected?.summary.initiative || '-'"></strong></div>
            <div class="stat-tile"><span x-text="t('speed')">Speed</span><strong x-text="speedShort(selected?.summary.speed)" :title="selected?.summary.speed"></strong></div>
            <div class="stat-tile"><span x-text="t('proficiency')">Proficiency</span><strong x-text="selected?.summary.proficiencyBonus || '-'"></strong></div>
          </section>

          <section class="stat-grid combat-stat-grid">
            <div class="stat-tile"><span x-text="t('attackBonus')">Attack</span><strong x-text="selected?.summary.attackBonus || '-'"></strong></div>
            <div class="stat-tile"><span x-text="t('spellAttack')">Spell Atk</span><strong x-text="selected?.summary.spellAttackBonus || '-'"></strong></div>
            <div class="stat-tile"><span x-text="t('spellDc')">Spell DC</span><strong x-text="selected?.summary.spellSaveDc || '-'"></strong></div>
            <div class="stat-tile"><span x-text="t('passivePerception')">Passive</span><strong x-text="selected?.summary.passivePerception || '-'"></strong></div>
          </section>

          <section class="hp-panel" :class="'hp-' + (selected?.resources.hp.state || 'healthy')">
            <div class="hp-line">
              <strong x-text="t('hp')">Hit Points</strong>
              <span x-text="`${selected?.resources.hp.value ?? 0} / ${selected?.resources.hp.max ?? 0}`"></span>
            </div>
            <div class="hp-track">
              <div class="hp-fill" :style="`width: ${selected?.resources.hp.pct || 0}%`"></div>
            </div>
            <div class="temp-hp-block" x-show="selected?.resources.hp.temp">
              <div class="hp-line hp-temp-line">
                <strong x-text="t('tempHpLabel')">Temp HP</strong>
                <span x-text="`+${selected?.resources.hp.temp ?? 0}`"></span>
              </div>
              <div class="hp-track hp-temp-track">
                <div class="hp-temp-fill" :style="`width: ${tempHpPct()}%`"></div>
              </div>
            </div>
          </section>

          <section class="spell-slot-panel" x-show="selected?.resources.spellSlots.length">
            <div class="spell-slot-head">
              <h3 x-text="t('spellSlots')">Spell Slots</h3>
              <span x-text="spellSlotSummary()"></span>
            </div>
            <template x-for="slot in selected?.resources.spellSlots" :key="slot.level">
              <div class="spell-slot-row">
                <div class="spell-slot-label">
                  <strong x-text="spellSlotLabel(slot)"></strong>
                  <span x-text="`${spellSlotAvailable(slot)} / ${slot.max}`"></span>
                </div>
                <div class="spell-slot-cells" role="group" :aria-label="t('spellSlotAria', { level: spellSlotLabel(slot), available: spellSlotAvailable(slot), max: slot.max })">
                  <template x-for="cell in spellSlotCells(slot)" :key="cell.index">
                    <span class="spell-slot-cell" :class="{ spent: cell.spent }"></span>
                  </template>
                </div>
              </div>
            </template>
          </section>

          <section class="special-resource-panel" x-show="specialResources().length">
            <div class="special-resource-head">
              <h3 x-text="t('specialResources')">Special Resources</h3>
              <span x-text="t('itemCount', { count: specialResources().length })"></span>
            </div>
            <div class="resource-list">
              <template x-for="resource in specialResources()" :key="resource.id || resource.name">
                <div class="resource-card">
                  <div class="resource-line">
                    <strong x-text="resource.name"></strong>
                    <span class="resource-count" :class="{ empty: resourceAvailable(resource) <= 0 }" x-text="`${resourceAvailable(resource)} / ${resourceMax(resource)}`"></span>
                  </div>
                  <p x-show="resourceMeta(resource)" x-text="resourceMeta(resource)"></p>
                </div>
              </template>
            </div>
          </section>
        </aside>

        <section class="content-column">
          <nav class="tabs">
            <template x-for="tabItem in visibleTabs()" :key="tabItem.id">
              <button class="tab" :class="{ active: tab === tabItem.id }" type="button" x-on:click="tab = tabItem.id" x-text="tabLabel(tabItem)"></button>
            </template>
          </nav>

          <section x-show="tab === 'overview'">
            <div class="panel">
              <div class="panel-head"><h3 x-text="t('attributes')">Attributes</h3></div>
              <div class="panel-body ability-grid">
                <template x-for="ability in selected?.details.abilities" :key="ability.key">
                  <div class="ability">
                    <span x-text="abilityLabel(ability)"></span>
                    <strong x-text="ability.score"></strong>
                    <small x-text="ability.mod"></small>
                  </div>
                </template>
              </div>
            </div>

            <div x-html="listPanelHtml(t('saves'), selected?.details.saves, 'value', 'ability', true)"></div>
            <div x-html="skillsPanelHtml(selected?.details.skills, selected?.details.abilities)"></div>
            <div x-html="traitsPanelHtml([
              { title: t('damageResistances'), items: selected?.details.traits.damageResistances },
              { title: t('damageImmunities'), items: selected?.details.traits.damageImmunities },
              { title: t('damageVulnerabilities'), items: selected?.details.traits.damageVulnerabilities },
              { title: t('conditionImmunities'), items: selected?.details.traits.conditionImmunities },
              { title: t('languages'), items: selected?.details.traits.languages },
              { title: t('senses'), items: selected?.details.traits.senses }
            ])"></div>
          </section>

          <section x-show="tab === 'spells'">
            <div class="filters">
              <input class="search" name="spell-search" type="search" :placeholder="t('searchSpells')" x-model.debounce.150ms="spellQuery">
              <div class="segmented">
                <button type="button" :class="{ active: spellLevel === 'all' }" x-on:click="spellLevel = 'all'" x-text="t('all')">All</button>
                <template x-for="level in spellLevels()" :key="level">
                  <button type="button" :class="{ active: spellLevel === String(level) }" x-on:click="spellLevel = String(level)" x-text="spellLevelLabel(level)"></button>
                </template>
              </div>
            </div>
            <div x-html="detailsListHtml(filteredSpells(), 'spell')"></div>
          </section>

          <section x-show="tab === 'actions'">
            <div x-html="actionGroupsHtml(selected?.sections.actions)"></div>
          </section>

          <section x-show="tab === 'inventory'">
            <div class="filters">
              <input class="search" name="item-search" type="search" :placeholder="t('searchItems')" x-model.debounce.150ms="itemQuery">
              <div class="segmented">
                <button type="button" :class="{ active: itemFilter === 'all' }" x-on:click="itemFilter = 'all'" x-text="t('all')">All</button>
                <button type="button" :class="{ active: itemFilter === 'equipped' }" x-on:click="itemFilter = 'equipped'" x-text="t('equipped')">Equipped</button>
                <button type="button" :class="{ active: itemFilter === 'consumable' }" x-on:click="itemFilter = 'consumable'" x-text="t('consumable')">Consumables</button>
                <button type="button" :class="{ active: itemFilter === 'weapon' }" x-on:click="itemFilter = 'weapon'" x-text="t('weapon')">Weapons</button>
              </div>
            </div>
            <div x-html="detailsListHtml(filteredItems(), 'item')"></div>
          </section>

          <section x-show="tab === 'features'">
            <div x-html="detailsListHtml(selected?.sections.features, 'feature')"></div>
          </section>
        </section>
      </div>
    </section>

    <div class="reference-backdrop" x-show="activeReference()" x-on:click="closeReference()" x-cloak
      x-transition:enter="bd-enter" x-transition:enter-start="bd-enter-start" x-transition:enter-end="bd-enter-end"
      x-transition:leave="bd-leave" x-transition:leave-start="bd-leave-start" x-transition:leave-end="bd-leave-end"></div>
    <aside class="reference-panel" x-show="activeReference()" role="dialog" aria-modal="true" :aria-label="activeReference()?.name || t('referenceDetails')" x-cloak
      x-transition:enter="ref-enter" x-transition:enter-start="ref-enter-start" x-transition:enter-end="ref-enter-end"
      x-transition:leave="ref-leave" x-transition:leave-start="ref-leave-start" x-transition:leave-end="ref-leave-end">
      <div class="reference-grab" aria-hidden="true"></div>
      <header class="reference-head">
        <div>
          <span x-text="t('referenceDetails')">Reference Details</span>
          <h2 x-text="activeReference()?.name"></h2>
          <p x-show="activeReferenceSubtitle()" x-text="activeReferenceSubtitle()"></p>
        </div>
        <button class="reference-close" type="button" x-on:click="closeReference()" :aria-label="t('closeReference')">×</button>
      </header>
      <div class="reference-body">
        <div class="fact-row reference-facts" x-show="referenceFactsHtml()" x-html="referenceFactsHtml()"></div>
        <div class="reference-copy" x-html="activeReferenceDescriptionHtml()"></div>
      </div>
    </aside>
  </main>
</body>
</html>
